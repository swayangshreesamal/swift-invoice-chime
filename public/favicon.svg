<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1b452f" />
      <stop offset="100%" stop-color="#103320" />
    </linearGradient>
    <linearGradient id="bellGrad" x1="40" y1="16" x2="48" y2="30" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="docShadow" x="14" y="14" width="36" height="46" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.3" />
    </filter>
    <filter id="bellShadow" x="35" y="15" width="18" height="20" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Green Squircle Base -->
  <rect width="64" height="64" rx="15" fill="url(#bg)" />

  <!-- White Invoice Document with Folded Top-Right Corner -->
  <g filter="url(#docShadow)">
    <path d="M 18 17.5 C 18 15.5 19.5 14 21.5 14 H 36 L 46 24 V 47.5 C 46 49.5 44.5 51 42.5 51 H 21.5 C 19.5 51 18 49.5 18 47.5 Z" fill="#ffffff" />
    <!-- Folded Corner Flap -->
    <path d="M 36 14 V 22 C 36 23.1 36.9 24 38 24 H 46 Z" fill="#e2e8f0" />
    <!-- Document Lines -->
    <rect x="23" y="32" width="18" height="3" rx="1.5" fill="#94a3b8" />
    <rect x="23" y="39" width="12" height="3" rx="1.5" fill="#94a3b8" />
  </g>

  <!-- 3D Golden Chime Bell -->
  <g filter="url(#bellShadow)">
    <!-- Bell Loop -->
    <circle cx="43.5" cy="18" r="1.5" fill="#fbbf24" />
    <!-- Bell Flare Body -->
    <path d="M 43.5 17.5 C 42 17.5 40 19 39.5 24 C 39.2 26.5 37.5 27.5 37 28.5 C 36.8 29 37.2 29.5 37.8 29.5 H 49.2 C 49.8 29.5 50.2 29 50 28.5 C 49.5 27.5 47.8 26.5 47.5 24 C 47 19 45 17.5 43.5 17.5 Z" fill="url(#bellGrad)" />
    <!-- Bell Clapper -->
    <circle cx="43.5" cy="30.5" r="1.2" fill="#92400e" />
  </g>
</svg>
